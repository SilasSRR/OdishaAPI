name: YouTube Sync

on:
  schedule:
    # every 30 minutes UTC
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run QT incremental sync
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          YT_QT_CHANNEL_ID: ${{ secrets.YT_QT_CHANNEL_ID }}
        run: node scripts/syncQtRecent.js

      - name: Run Live incremental sync
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          YT_LIVE_CHANNEL_ID: ${{ secrets.YT_LIVE_CHANNEL_ID }}
        run: node scripts/syncLiveRecent.js

      - name: Run Other incremental sync
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          YT_OTHER_CHANNEL_ID: ${{ secrets.YT_OTHER_CHANNEL_ID }}
        run: node scripts/syncOtherRecent.js
